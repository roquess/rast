name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install GDAL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gdal-bin

      - name: Install GDAL (macOS)
        if: runner.os == 'macOS'
        run: brew install gdal

      - name: Build NIF
        shell: bash
        run: |
          cargo build --release --manifest-path native/rast/Cargo.toml
          mkdir -p priv
          # Per-platform name: rast-<os>-<arch>. Erlang loads NIFs as .so on all
          # Unix (macOS included) and .dll on Windows.
          case "$RUNNER_OS" in
            Windows) SRC=native/rast/target/release/rast.dll;      OS=windows; EXT=dll ;;
            macOS)   SRC=native/rast/target/release/librast.dylib; OS=darwin;  EXT=so ;;
            *)       SRC=native/rast/target/release/librast.so;     OS=linux;   EXT=so ;;
          esac
          case "$(uname -m)" in arm64|aarch64) ARCH=aarch64 ;; *) ARCH=x86_64 ;; esac
          cp "$SRC" "priv/rast-${OS}-${ARCH}.${EXT}"

      - name: Test
        shell: bash
        env:
          # GitHub's Windows runner has no usable GDAL; skip the GDAL-backed
          # tests there (kernels, tiling, convolution and orchestration still run).
          RAST_NO_GDAL: ${{ runner.os == 'Windows' && '1' || '' }}
        run: rebar3 ct

      - name: Upload prebuilt NIF
        uses: actions/upload-artifact@v4
        with:
          name: rast-nif-${{ runner.os }}
          path: priv/rast-*
          if-no-files-found: error
